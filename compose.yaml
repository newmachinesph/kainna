services:
  web:
    build:
      context: ./kainna-web
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    environment:
      SALO_DATA_DIR: /catalog
      SALO_DB_PATH: /data/salo.db
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: salosalo-food
      S3_PUBLIC_BASE: http://localhost:9000/salosalo-food
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-salosalo}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-salosalo-local-2026}
    volumes:
      - ./kainna-web/src/data:/catalog:ro
      - api-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salosalo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-salosalo-local-2026}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  seed-images:
    build: ./api
    command: ["python", "seed_images.py"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: salosalo-food
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-salosalo}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-salosalo-local-2026}
    volumes:
      - ./kainna-web/public/food:/images:ro
    depends_on:
      minio:
        condition: service_started
    restart: "no"

volumes:
  api-data:
  minio-data:
