services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: kainna
      MARIADB_USER: kainna
      MARIADB_PASSWORD: ${DB_PASSWORD:-kainna-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kainna-local-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
